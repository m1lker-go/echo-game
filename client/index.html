<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>ECHO</title>
  <link rel="stylesheet" href="./style.css?v=echo-language-selector-3" />
</head>
<body>
  <main id="game" aria-label="ECHO game" data-i18n-aria-label="menu:game_aria_label">
    <canvas id="world" aria-label="Игровое поле" data-i18n-aria-label="menu:world_aria_label"></canvas>
    <canvas id="shared-food" aria-hidden="true"></canvas>
    <canvas id="models" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <header class="hud">
      <div class="brand">ECHO<span class="brand-dot">.</span></div>
      <div class="status-stack">
        <div class="status"><span id="connection-dot"></span><span id="connection-label" data-i18n="game:connection_pending">подключение…</span></div>
        <button id="game-exit" class="game-exit" type="button" data-i18n="game:exit">Покинуть игру</button>
      </div>
    </header>

    <div id="energy" class="energy" aria-label="Энергия" data-i18n-aria-label="game:energy_aria_label">0</div>
    <div id="coords" class="coords" aria-label="Координаты" data-i18n-aria-label="game:coords_aria_label">0 · 0</div>

    <button id="boost" class="ability-button boost-button" type="button" aria-label="Ускорение" data-i18n-aria-label="game:boost_aria_label">
      <span class="ability-icon" aria-hidden="true">↯</span>
    </button>
    <button id="jump" class="ability-button jump-button" type="button" aria-label="Прыжок" data-i18n-aria-label="game:jump_aria_label">
      <span class="ability-icon" aria-hidden="true">↟</span>
    </button>

    <div id="joystick" class="joystick" aria-hidden="true"><div id="stick" class="stick"></div></div>

    <section id="defeat-screen" class="defeat-screen" hidden aria-label="Поражение" data-i18n-aria-label="game:defeat_aria_label">
      <div class="defeat-panel">
        <div class="defeat-title" data-i18n="game:defeat_title">Поражение</div>
        <button id="defeat-replay" type="button" data-i18n="game:defeat_replay">Играть снова</button>
        <button id="defeat-menu" type="button" data-i18n="game:defeat_menu">В меню</button>
      </div>
    </section>
  </main>

  <div id="main-menu" class="main-menu" aria-label="Главное меню" data-i18n-aria-label="menu:main_aria_label">
    <div class="menu-screen" id="menu-main">
      <div class="menu-logo" data-i18n="menu:logo">ЭХО<span class="menu-logo-dot">.</span></div>
      <div class="menu-actions">
        <button id="menu-start" type="button" data-i18n="menu:start">Начать игру</button>
        <button id="menu-character-button" type="button" data-i18n="menu:character">Персонаж</button>
        <button id="menu-rating" type="button" data-i18n="menu:rating">Рейтинг</button>
        <button id="menu-settings" type="button" data-i18n="menu:settings">Настройки</button>
      </div>
      <div class="menu-footer">
        <div class="language-selector" aria-label="Язык" data-i18n-aria-label="menu:language_aria_label">
          <button class="language-option" type="button" data-language="ru" aria-label="Русский" data-i18n-aria-label="menu:language_ru_aria_label"><img src="./assets/icons/icon-ru.webp" alt="" aria-hidden="true"></button>
          <button class="language-option" type="button" data-language="en" aria-label="English" data-i18n-aria-label="menu:language_en_aria_label"><img src="./assets/icons/icon-en.webp" alt="" aria-hidden="true"></button>
        </div>
        <button id="menu-clear-cache" type="button" data-i18n="menu:clear_cache">Очистить кэш</button>
      </div>
    </div>

    <div class="menu-screen" id="menu-character" hidden>
      <div class="menu-title" data-i18n="menu:character">Персонаж</div>
      <div id="character-grid" class="character-grid"></div>
      <button id="character-back" class="menu-back" type="button" data-i18n="menu:back">Назад</button>
    </div>

    <div class="menu-screen" id="menu-placeholder" hidden>
      <div id="placeholder-title" class="menu-title">Рейтинг</div>
      <div class="menu-placeholder-text" data-i18n="menu:placeholder_text">Раздел в разработке.</div>
      <button id="placeholder-back" class="menu-back" type="button" data-i18n="menu:back">Назад</button>
    </div>

    <div class="menu-screen" id="menu-settings-screen" hidden>
      <div class="menu-title" data-i18n="menu:settings">Настройки</div>
      <div class="settings-list">
        <div class="settings-row"><span data-i18n="menu:language">Язык</span><div class="language-selector settings-language"><button class="language-option" type="button" data-language="ru" aria-label="Русский" data-i18n-aria-label="menu:language_ru_aria_label"><img src="./assets/icons/icon-ru.webp" alt="" aria-hidden="true"></button><button class="language-option" type="button" data-language="en" aria-label="English" data-i18n-aria-label="menu:language_en_aria_label"><img src="./assets/icons/icon-en.webp" alt="" aria-hidden="true"></button></div></div>
        <button id="menu-settings-sound" type="button" data-i18n="menu:sound">Звук</button>
        <button id="menu-settings-controls" type="button" data-i18n="menu:controls">Управление</button>
      </div>
      <button id="settings-back" class="menu-back" type="button" data-i18n="menu:back">Назад</button>
    </div>
  </div>

  <div id="echo-modal-root" class="echo-modal-root" aria-hidden="true"></div>

  <script type="module" src="./i18n.js"></script>
  <script type="module" src="./modal.js"></script>
  <script type="module" src="./model-preloader.js"></script>
  <script type="module" src="./asset-loader-patch.js"></script>
  <script type="module" src="./menu.js?v=echo-language-selector-3"></script>
  <script type="module" src="./cache-reset.js?v=echo-settings-5"></script>
  <script type="module" src="./jump-cooldown.js"></script>
  <script type="module" src="./shared-food.js"></script>
  <script type="module" src="./game.js"></script>
  <script type="module" src="./world-boundary.js"></script>
</body>
</html>
