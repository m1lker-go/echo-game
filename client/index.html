<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>ECHO</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game" aria-label="ECHO game">
    <canvas id="world" aria-label="Игровое поле"></canvas>
    <canvas id="shared-food" aria-hidden="true"></canvas>
    <canvas id="models" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <header class="hud">
      <div class="brand">ECHO<span class="brand-dot">.</span></div>
      <div class="status-stack">
        <div class="status"><span id="connection-dot"></span><span id="connection-label">подключение…</span></div>
        <button id="game-exit" class="game-exit" type="button">Покинуть игру</button>
      </div>
    </header>
    <div class="stats"><span class="stats-label">ЭНЕРГИЯ</span><strong id="energy">0</strong><span class="stats-hint">тестовое поле</span></div>
    <div class="center-mark" aria-hidden="true"></div>
    <div class="controls-hint" id="controls-hint">WASD / ← ↑ → ↓ — движение</div>
    <div class="mobile-controls" aria-label="Сенсорное управление">
      <div id="joystick" class="joystick" role="application" aria-label="Джойстик">
        <div id="stick" class="stick"></div>
      </div>
      <div class="ability-stack">
        <button id="boost" class="ability" type="button" aria-label="Ускорение">
          <span>»</span><small>РЫВОК</small><b class="ability-cooldown" aria-hidden="true"></b>
        </button>
        <button id="jump" class="ability jump-ability" type="button" aria-label="Прыжок">
          <span>↑</span><small>ПРЫЖОК</small>
        </button>
      </div>
    </div>
    <div class="footer"><span>ПРОТОТИП 01</span><span id="coords">0 · 0</span></div>

    <section id="defeat-screen" class="defeat-screen" hidden aria-label="Поражение">
      <div class="defeat-card">
        <div class="defeat-title">ВЫ ПРОИГРАЛИ</div>
        <div class="defeat-subtitle">Ваша энергия закончилась</div>
        <div class="defeat-buttons">
          <button id="defeat-replay" class="menu-button" type="button">Сыграть ещё</button>
          <button id="defeat-menu" class="menu-button" type="button">Назад в меню</button>
        </div>
      </div>
    </section>

    <section id="main-menu" class="main-menu" aria-label="Главное меню">
      <canvas id="menu-food" class="menu-food" aria-hidden="true"></canvas>

      <div id="menu-main" class="menu-screen menu-main-screen">
        <div class="menu-logo">ECHO<span>.</span></div>
        <div class="menu-buttons">
          <button id="menu-start" class="menu-button" type="button">Начать игру</button>
          <button id="menu-character-button" class="menu-button" type="button">Персонаж</button>
          <button id="menu-settings" class="menu-button" type="button">Настройки</button>
          <button id="menu-rating" class="menu-button" type="button">Рейтинг</button>
        </div>
      </div>

      <div id="menu-character" class="menu-screen character-screen" hidden>
        <div class="menu-page-head">
          <h1>ПЕРСОНАЖ</h1>
          <p>Выбери того, кто появится в игре</p>
        </div>
        <div id="character-grid" class="character-grid"></div>
        <button id="character-back" class="menu-back" type="button">Назад</button>
      </div>

      <div id="menu-placeholder" class="menu-screen placeholder-screen" hidden>
        <h1 id="placeholder-title">РАЗДЕЛ</h1>
        <p>Этот экран пока готовится</p>
        <button id="placeholder-back" class="menu-back" type="button">Назад</button>
      </div>
    </section>
  </main>

  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script type="module" src="./asset-loader-patch.js"></script>
  <script type="module" src="./menu.js"></script>
  <script type="module" src="./jump-cooldown.js"></script>
  <script type="module" src="./shared-food.js"></script>
  <script type="module" src="./game.js"></script>
  <script type="module" src="./world-boundary.js"></script>
</body>
</html>
