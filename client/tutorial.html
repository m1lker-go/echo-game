<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050c16">
  <meta name="robots" content="noindex,nofollow">
  <title>ECHO — тестовое обучение</title>
  <link rel="icon" href="./assets/icons/favicon.png">
  <link rel="stylesheet" href="./style.css?v=echo-language-selector-3">
  <link rel="stylesheet" href="./ui-layout.css?v=echo-wasd-hint-scale-1">
  <link rel="stylesheet" href="./daily-quests.css?v=echo-quest-status-sort-1">
  <link rel="stylesheet" href="./echo-font.css?v=echo-global-font-1">
  <link rel="stylesheet" href="./tutorial.css?v=echo-tutorial-3">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <main id="game" class="tutorial-game" data-tutorial-stage="0">
    <canvas id="tutorial-ground" aria-hidden="true"></canvas>
    <canvas id="tutorial-models" aria-hidden="true"></canvas>
    <canvas id="player-labels" aria-hidden="true"></canvas>
    <div class="vignette tutorial-vignette" aria-hidden="true"></div>
    <header class="hud tutorial-header">
      <div class="brand tutorial-brand">ЭХО<span class="brand-dot">.</span></div>
      <a class="game-exit tutorial-back" href="./" aria-label="Вернуться в меню">В МЕНЮ ✕</a>
    </header>
    <!-- Same top-center quest HUD markup and styles as in the real ECHO arena. -->
    <div id="echo-quest-hud" class="echo-quest-hud tutorial-task" aria-live="polite" aria-atomic="true">
      <span id="echo-quest-hud-name" class="echo-quest-hud-name">
        <span class="echo-quest-hud-heading">
          <span id="tutorial-task-title" class="echo-quest-hud-title">НАУЧИСЬ ДВИГАТЬСЯ</span>
          <span id="tutorial-stage-dots" class="echo-quest-levels" aria-label="Этап 1 из 5"></span>
        </span>
        <span id="tutorial-task-hint" class="echo-quest-hud-description">Пройди к светящейся отметке</span>
      </span>
      <button type="button" id="tutorial-progress" class="echo-quest-hud-action" disabled>Осталось: 126</button>
    </div>
    <section id="tutorial-toast" class="tutorial-toast" role="status" aria-live="polite" hidden>
      <strong id="tutorial-toast-title"></strong><span id="tutorial-toast-text"></span>
    </section>
    <div class="stats tutorial-energy"><span class="stats-label">ЭНЕРГИЯ</span><strong id="tutorial-energy">0</strong></div>
    <div class="controls-hint tutorial-controls-tip">WASD / ← ↑ → ↓ — движение · ПРОБЕЛ — рывок · J — прыжок</div>
    <div class="mobile-controls tutorial-mobile-controls">
      <div id="joystick" class="joystick" role="application" aria-label="Джойстик"><div id="stick" class="stick"></div></div>
      <div class="ability-stack">
        <button id="boost" class="ability" type="button" aria-label="Рывок"><span>»</span><small>РЫВОК</small></button>
        <button id="jump" class="ability jump-ability" type="button" aria-label="Прыжок"><span>↑</span><small>ПРЫЖОК</small></button>
      </div>
    </div>
    <div id="tutorial-rotate">ПОВЕРНИ УСТРОЙСТВО ГОРИЗОНТАЛЬНО</div>
  </main>
  <script src="./modal.js?v=echo-round-result-3"></script>
  <script type="module" src="./tutorial.js?v=echo-tutorial-3"></script>
</body>
</html>
