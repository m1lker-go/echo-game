name: Build ECHO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - apk

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify battle ad flow
        run: node --test server/test/battle-entry-ads.test.js server/test/defeat-menu.test.js server/test/android-settings-ui.test.js server/test/android-auth-five-providers.test.js server/test/android-release-config.test.js server/test/android-voice-permissions.test.js
      - name: Compile Android APK
        env:
          # Optional: enable native VK / OK / Mail for CI-built APKs.
          # Required only in GitHub Actions; never commit the real secret.
          ECHO_VK_CLIENT_SECRET: ${{ secrets.ECHO_VK_CLIENT_SECRET }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
